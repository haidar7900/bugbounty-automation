name: Auto Bug Bounty Hunt

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:
    inputs:
      target:
        description: 'Single target domain'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ⚠️ الأهم: submodules: recursive — بدونها tools/ تطلع فاضية
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify submodules populated
        run: |
          echo "Submodule count: $(git submodule status | wc -l)"
          ls -la tools/ | head -40

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node (لـ MCP tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install core tools (PATH first)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:$HOME/.local/bin"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install github.com/ffuf/ffuf/v2@latest
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/tomnomnom/assetfinder@latest
          go install github.com/lc/gau/v2/cmd/gau@latest
          go install github.com/hahwul/dalfox/v2@latest

          nuclei -update-templates -silent || true

      - name: Run setup.sh (installs tools/ submodules)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:$HOME/.local/bin"
          bash setup.sh
        continue-on-error: true

      - name: Verify critical tools available
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:$HOME/.local/bin"
          for t in subfinder httpx katana nuclei ffuf gau dalfox; do
            if command -v $t >/dev/null 2>&1; then
              echo "OK: $t"
            else
              echo "MISSING: $t"
            fi
          done

      - name: Prepare targets
        run: |
          mkdir -p output
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "${{ github.event.inputs.target }}" > targets.txt
          elif [ -f targets.txt ]; then
            echo "Using existing targets.txt"
          else
            echo "example.com" > targets.txt
          fi
          cat targets.txt

      - name: Run recon pipeline
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin:$HOME/.local/bin"
          while read -r domain; do
            [ -z "$domain" ] && continue
            echo "=== Hunting: $domain ==="
            subfinder -d "$domain" -silent > output/subs.txt || true
            httpx -l output/subs.txt -silent -o output/live.txt || true
            nuclei -l output/live.txt -silent -o output/nuclei.txt || true
          done < targets.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-results-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp -r output/* results/ 2>/dev/null || true
          git add results/ || true
          git diff --staged --quiet || git commit -m "auto-hunt results [skip ci]"
          git push || true
