name: 🤖 Auto Bug Hunt
on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git golang python3-pip jq
          chmod +x setup.sh
          ./setup.sh
      - name: Run Scan
        run: |
          cd tools/hawkeye
          ./hawkeye -d example.com
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: bug-reports
          path: reports/
