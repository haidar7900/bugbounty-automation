name: 🤖 ULTIMATE Pentesting (All Tools)
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install All Tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq nmap masscan

          # أدوات Go الأساسية
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/ffuf/ffuf/v2@latest
          go install -v github.com/tomnomnom/waybackurls@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/OWASP/Amass/v3/...@master

          # أدوات الاستغلال (Strix)
          git clone https://github.com/usestrix/strix.git /tmp/strix
          cd /tmp/strix && pip install -r requirements.txt
          sudo cp /tmp/strix/strix /usr/local/bin/

          # أدوات مسح الثغرات (ONUS)
          pip install git+https://github.com/maverickaayush/ONUS.git

          # أدوات تجاوز الجدران النارية (XSSHunt)
          go install -v github.com/Serdar715/xsshunt@latest

          # أدوات اكتشاف المعلومات الحساسة (Nosey Parker)
          go install -v github.com/praetorian-inc/noseyparker@latest

          # تحديث قوالب Nuclei
          nuclei -update-templates

          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: 🔥 Ultimate Scan (All Tools)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p reports logs
          
          run_safe() {
            echo "[*] Running: $1"
            timeout 300 bash -c "$1" 2>&1 | tee -a logs/errors.log || {
              echo "[!] Command failed: $1 (continuing...)"
              echo "ERROR: $1" >> logs/failed_commands.txt
            }
          }
          
          echo "# 🛡️ ULTIMATE PENTESTING REPORT" > reports/FINAL.md
          echo "**Date:** $(date)" >> reports/FINAL.md
          echo "" >> reports/FINAL.md
          
          while read target; do
            [ -z "$target" ] && continue
            echo "========================================" | tee -a reports/FINAL.md
            echo "🎯 TARGET: $target" | tee -a reports/FINAL.md
            echo "========================================" | tee -a reports/FINAL.md
            
            # ----- 1. RECON (Amass + Subfinder + Assetfinder) -----
            echo "[1/6] RECON (Amass + Subfinder)..." >> reports/FINAL.md
            run_safe "amass enum -d $target -o reports/amass_${target}.txt"
            run_safe "subfinder -d $target -silent -o reports/sub_${target}.txt"
            run_safe "assetfinder -subs-only $target > reports/asset_${target}.txt"
            
            # دمج النطاقات
            cat reports/amass_${target}.txt reports/sub_${target}.txt reports/asset_${target}.txt > reports/all_${target}.txt
            sort -u reports/all_${target}.txt -o reports/all_${target}.txt
            
            # ----- 2. ALIVE HOSTS (httpx) -----
            echo "[2/6] ALIVE HOSTS (httpx)..." >> reports/FINAL.md
            run_safe "httpx -l reports/all_${target}.txt -silent -o reports/alive_${target}.txt"
            
            # ----- 3. SCANNING (ONUS + Nosey Parker) -----
            echo "[3/6] SCANNING (ONUS + Nosey Parker)..." >> reports/FINAL.md
            run_safe "onus scan $target --output reports/onus_${target}.json"
            run_safe "noseyparker scan $target --output reports/noseyparker_${target}.json"
            
            # ----- 4. EXPLOITATION (Strix) -----
            echo "[4/6] EXPLOITATION (Strix - PoC)..." >> reports/FINAL.md
            run_safe "strix --target $target --output reports/strix_${target}.json"
            
            # ----- 5. WAF BYPASS (XSSHunt) -----
            echo "[5/6] WAF BYPASS (XSSHunt)..." >> reports/FINAL.md
            run_safe "xsshunt -u https://$target -o reports/xsshunt_${target}.txt"
            
            # ----- 6. NUCLEI (Final Scan) -----
            echo "[6/6] NUCLEI (Vulnerabilities)..." >> reports/FINAL.md
            run_safe "nuclei -l reports/alive_${target}.txt -severity low,medium,high,critical -o reports/nuclei_${target}.txt"
            
            # ----- FINAL REPORT -----
            echo "## 🔍 RECON RESULTS" >> reports/FINAL.md
            cat reports/all_${target}.txt >> reports/FINAL.md 2>/dev/null || echo "None" >> reports/FINAL.md
            echo "" >> reports/FINAL.md
            
            echo "## 🛡️ SCAN RESULTS" >> reports/FINAL.md
            cat reports/onus_${target}.json >> reports/FINAL.md 2>/dev/null || echo "None" >> reports/FINAL.md
            echo "" >> reports/FINAL.md
            
            echo "## ⚡ EXPLOITATION RESULTS (Strix)" >> reports/FINAL.md
            cat reports/strix_${target}.json >> reports/FINAL.md 2>/dev/null || echo "None" >> reports/FINAL.md
            echo "" >> reports/FINAL.md
            
            echo "## 🚧 WAF BYPASS RESULTS" >> reports/FINAL.md
            cat reports/xsshunt_${target}.txt >> reports/FINAL.md 2>/dev/null || echo "None" >> reports/FINAL.md
            echo "" >> reports/FINAL.md
            
            echo "## 🚨 NUCLEI VULNERABILITIES" >> reports/FINAL.md
            cat reports/nuclei_${target}.txt >> reports/FINAL.md 2>/dev/null || echo "None" >> reports/FINAL.md
            echo "" >> reports/FINAL.md
            
            echo "---" >> reports/FINAL.md
            
          done < config/targets.txt
          
          echo "✅ Scan completed." >> reports/FINAL.md

      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Reports
          path: |
            reports/
            logs/
