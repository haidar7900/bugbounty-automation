name: 🤖 Ultimate Bug Bounty (Stable Version)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Core Tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq nmap
          
          # تثبيت الأدوات الأساسية
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/ffuf/ffuf/v2@latest
          
          # تحديث قوالب Nuclei
          nuclei -update-templates
          
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: 🔥 Run Scan (Stable)
        run: |
          mkdir -p reports
          echo "# 🛡️ Bug Bounty Report (Stable)" > reports/FINAL_REPORT.md
          echo "**Date:** $(date)" >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md

          while read target; do
            echo "========================================" | tee -a reports/FINAL_REPORT.md
            echo "🎯 Target: $target" | tee -a reports/FINAL_REPORT.md
            echo "========================================" | tee -a reports/FINAL_REPORT.md

            # 1. جمع النطاقات الفرعية
            echo "[1/3] Subfinder - discovering subdomains..."
            subfinder -d $target -silent -o reports/sub_$target.txt || echo "Subfinder failed"
            
            # 2. فلترة النطاقات الحية
            echo "[2/3] Httpx - filtering alive hosts..."
            httpx -l reports/sub_$target.txt -silent -o reports/alive_$target.txt || echo "Httpx failed"
            
            # 3. مسح الثغرات
            echo "[3/3] Nuclei - scanning vulnerabilities..."
            nuclei -l reports/alive_$target.txt -severity low,medium,high,critical -o reports/nuclei_$target.txt || echo "Nuclei failed"
            
            # تجميع النتائج
            echo "### 🔍 Subdomains:" >> reports/FINAL_REPORT.md
            cat reports/sub_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
            echo "" >> reports/FINAL_REPORT.md
            
            echo "### 🟢 Alive Hosts:" >> reports/FINAL_REPORT.md
            cat reports/alive_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
            echo "" >> reports/FINAL_REPORT.md
            
            echo "### 🚨 Vulnerabilities:" >> reports/FINAL_REPORT.md
            cat reports/nuclei_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
            echo "" >> reports/FINAL_REPORT.md
            echo "---" >> reports/FINAL_REPORT.md

          done < config/targets.txt

      - name: 📤 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Bug-Reports
          path: reports/
