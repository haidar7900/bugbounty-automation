name: 🤖 Full Auto Hunt (Fire & Forget)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔥 الخطوة السحرية: استرجاع أو حفظ الأدوات في الكاش
      - name: Cache Go Binaries
        uses: actions/cache@v4
        id: cache-go
        with:
          path: |
            ~/go/bin
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Tools (Only if not cached)
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      # إذا كان الكاش موجود، نحتاج فقط نضيف الـ PATH
      - name: Set PATH for cached tools
        if: steps.cache-go.outputs.cache-hit == 'true'
        run: |
          echo "export PATH=$PATH:~/go/bin" >> $GITHUB_ENV

      - name: 🔥 Run Auto Scan on ALL targets in config/targets.txt
        run: |
          mkdir -p reports
          echo "# 🛡️ Auto Bug Bounty Report" > reports/FINAL_REPORT.md
          echo "**Date:** $(date)" >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md
          
          while read target; do
            echo "========================================" >> reports/FINAL_REPORT.md
            echo "🎯 Scanning Target: $target" | tee -a reports/FINAL_REPORT.md
            echo "========================================" >> reports/FINAL_REPORT.md
            
            subfinder -d $target -silent -o reports/sub_$target.txt
            httpx -l reports/sub_$target.txt -silent -o reports/alive_$target.txt
            nuclei -l reports/alive_$target.txt -severity low,medium,high,critical -o reports/nuclei_$target.txt
            
            echo "### 🔍 Subdomains Found:" >> reports/FINAL_REPORT.md
            cat reports/sub_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
            echo "### 🟢 Alive Hosts:" >> reports/FINAL_REPORT.md
            cat reports/alive_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
            echo "### 🚨 Nuclei Vulnerabilities:" >> reports/FINAL_REPORT.md
            cat reports/nuclei_$target.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "No vulnerabilities found" >> reports/FINAL_REPORT.md
            echo "" >> reports/FINAL_REPORT.md
            echo "---" >> reports/FINAL_REPORT.md
          done < config/targets.txt

      - name: 📤 Upload All Reports
        uses: actions/upload-artifact@v4
        with:
          name: Full-Bug-Reports
          path: reports/
