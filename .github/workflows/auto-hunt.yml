name: 🤖 Free Auto Bug Hunt (No API Keys)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Free Tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq nmap
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV
      
      - name: Run Recon (Subfinder + Httpx)
        run: |
          mkdir -p reports
          echo "🔍 Running reconnaissance on example.com..." 
          echo "Target: example.com" > reports/recon.txt
          echo "Date: $(date)" >> reports/recon.txt
      
      - name: Run Nuclei Scan
        run: |
          nuclei -u https://example.com -severity low,medium,high,critical -o reports/nuclei_results.txt || true
      
      - name: Run WP-Hunter (WordPress detection)
        run: |
          cd tools/wp-hunter-mcp
          python wp_hunter.py --target example.com --output ../../reports/wp_results.json || true
      
      - name: Generate Summary Report
        run: |
          echo "# 🛡️ Bug Bounty Report (Draft - Free Tools)" > reports/final_report.md
          echo "" >> reports/final_report.md
          echo "**Target:** example.com" >> reports/final_report.md
          echo "**Date:** $(date)" >> reports/final_report.md
          echo "**Status:** Draft - Review before submitting to HackerOne" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "## Scan Results" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "### Reconnaissance" >> reports/final_report.md
          cat reports/recon.txt >> reports/final_report.md 2>/dev/null || echo "No recon data" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "### Nuclei Findings" >> reports/final_report.md
          cat reports/nuclei_results.txt >> reports/final_report.md 2>/dev/null || echo "No nuclei findings" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "### WordPress Findings" >> reports/final_report.md
          cat reports/wp_results.json >> reports/final_report.md 2>/dev/null || echo "No WP findings" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "---" >> reports/final_report.md
          echo "*⚠️ This is an automated draft. Verify all findings before submitting to HackerOne.*" >> reports/final_report.md
      
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: free-bug-reports
          path: reports/
