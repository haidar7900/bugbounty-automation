name: 🤖 Full Auto Hunt (Fire & Forget)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          # تحديث قوالب Nuclei لأحدث إصدار (مهم جداً)
          nuclei -update-templates
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: 🔥 Run Scan (Using Pre-defined Subdomains)
        run: |
          mkdir -p reports
          echo "# 🛡️ Bug Bounty Report (Targeted Scan)" > reports/FINAL_REPORT.md
          echo "**Date:** $(date)" >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md
          echo "**Note:** Using predefined subdomain list (bypassed subfinder)." >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md

          # 1. فلترة النطاقات الحية من القائمة المعروفة
          echo "[1/2] Httpx - filtering alive hosts from known list..."
          httpx -l data/known_subdomains.txt -silent -o reports/alive_hosts.txt || echo "Httpx failed"

          # 2. مسح الثغرات على النطاقات الحية فقط
          echo "[2/2] Nuclei - scanning for vulnerabilities..."
          nuclei -l reports/alive_hosts.txt -severity low,medium,high,critical -o reports/nuclei_results.txt || echo "Nuclei failed"

          # كتابة التقرير
          echo "### 🟢 Alive Hosts (Scanned):" >> reports/FINAL_REPORT.md
          cat reports/alive_hosts.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "None" >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md

          echo "### 🚨 Nuclei Vulnerabilities Found:" >> reports/FINAL_REPORT.md
          cat reports/nuclei_results.txt >> reports/FINAL_REPORT.md 2>/dev/null || echo "No vulnerabilities found" >> reports/FINAL_REPORT.md
          echo "" >> reports/FINAL_REPORT.md

          echo "---" >> reports/FINAL_REPORT.md
          echo "✅ Scan completed."

      - name: 📤 Upload All Reports
        uses: actions/upload-artifact@v4
        with:
          name: Full-Bug-Reports
          path: reports/
