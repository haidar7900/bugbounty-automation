name: 🤖 ULTIMATE Bug Bounty (Parallel)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 🔍 Fetch Public Targets
        run: |
          curl -s https://raw.githubusercontent.com/arkadiyt/bounty-targets-data/main/data/domains.txt | head -500 > config/targets.txt
          echo "✅ Found $(wc -l < config/targets.txt) targets"
      - name: 📦 Split into chunks
        id: split
        run: |
          mkdir -p chunks
          split -l 30 config/targets.txt chunks/chunk_
          echo "matrix=$(ls chunks/chunk_* | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  hunt:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install core tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          pip install aiptx riftor
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV
      - name: 🔥 Scan chunk
        run: |
          mkdir -p reports
          while read target; do
            [ -z "$target" ] && continue
            echo "🔥 Scanning $target"
            subfinder -d "$target" -silent -o "reports/sub_$target.txt" || true
            httpx -l "reports/sub_$target.txt" -silent -o "reports/alive_$target.txt" || true
            nuclei -l "reports/alive_$target.txt" -severity low,medium,high,critical -o "reports/nuclei_$target.txt" || true
          done < "${{ matrix.chunk }}"
      - name: 📤 Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: chunk-reports-${{ strategy.job-index }}
          path: reports/
