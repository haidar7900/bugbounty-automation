name: 🤖 AI-Powered Auto Bug Hunt
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y git golang-go python3-pip jq nmap
          pip install aiptx riftor
          cd tools/BugTraceAI-CLI && pip install -r requirements.txt || true
          cd tools/wp-hunter-mcp && pip install -r requirements.txt || true
      
      - name: Run BugTraceAI with DeepSeek
        env:
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cd tools/BugTraceAI-CLI
          python main.py --target example.com --output ../../reports/bugtrace.json || echo "BugTraceAI skipped"
      
      - name: Run AIPTX Scan
        run: |
          aiptx scan example.com --format json --output reports/aiptx.json || echo "AIPTX skipped"
      
      - name: Generate Final Report
        run: |
          mkdir -p reports
          echo "# 🛡️ AI Bug Bounty Report (Draft)" > reports/final_report.md
          echo "" >> reports/final_report.md
          echo "**Target:** example.com" >> reports/final_report.md
          echo "**Date:** $(date)" >> reports/final_report.md
          echo "**AI Model:** DeepSeek" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "## Findings" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "### BugTraceAI Results" >> reports/final_report.md
          cat reports/bugtrace.json >> reports/final_report.md 2>/dev/null || echo "No data" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "### AIPTX Results" >> reports/final_report.md
          cat reports/aiptx.json >> reports/final_report.md 2>/dev/null || echo "No data" >> reports/final_report.md
          echo "" >> reports/final_report.md
          echo "---" >> reports/final_report.md
          echo "*⚠️ Draft report. Verify all findings manually before submitting to HackerOne.*" >> reports/final_report.md
      
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-bug-reports
          path: reports/
