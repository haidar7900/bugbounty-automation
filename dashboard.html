<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 haidar7900 · Ultimate Bug Bounty Dashboard</title>
    <!-- Font Awesome 6 (مجاني) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js للرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Animate.css للتأثيرات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0a0e17;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية شبكية متحركة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        /* جزيئات ذهبية متطايرة */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: float-particle linear infinite;
        }
        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ========== DASHBOARD WRAPPER ========== */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== HEADER ========== */
        .header {
            background: rgba(16, 24, 40, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 24px 36px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .brand .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #0a0e17;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .brand .sub {
            font-size: 13px;
            color: #8892b0;
            -webkit-text-fill-color: #8892b0;
            background: rgba(255,215,0,0.06);
            padding: 2px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.08);
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,215,0,0.05);
            padding: 10px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255,215,0,0.08);
        }
        .status-badge .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse-dot 2s infinite;
            transition: background 0.3s;
        }
        .status-badge .dot.idle { background: #facc15; }
        .status-badge .dot.running { background: #f97316; animation-duration: 0.6s; }
        .status-badge .dot.failed { background: #ef4444; }
        .status-badge .dot.success { background: #4ade80; }
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .status-badge .label {
            color: #ccd6f6;
            font-size: 14px;
            font-weight: 500;
        }
        .status-badge .time {
            color: #8892b0;
            font-size: 12px;
        }

        /* ========== STATS GRID ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(16, 24, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 22px 26px;
            border: 1px solid rgba(255,215,0,0.06);
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            opacity: 0;
            transition: 0.3s;
        }
        .stat-card:hover::after { opacity: 1; }
        .stat-card:hover {
            border-color: rgba(255,215,0,0.15);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .stat-card .number {
            font-size: 34px;
            font-weight: 700;
            color: #ffd700;
            letter-spacing: -0.5px;
        }
        .stat-card .desc {
            font-size: 13px;
            color: #8892b0;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-card .desc i { color: #ffd700; opacity: 0.6; }

        /* ========== CHARTS SECTION ========== */
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        .chart-box {
            background: rgba(16, 24, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255,215,0,0.06);
        }
        .chart-box h3 {
            color: #ccd6f6;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-box h3 i { color: #ffd700; }
        .chart-box canvas { max-height: 200px; max-width: 100%; }

        /* ========== ACTION AREA ========== */
        .action-area {
            background: rgba(16, 24, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 30px 36px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,215,0,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .action-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn-run {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 16px 44px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            color: #0a0e17;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-run:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }
        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(0.97);
            filter: grayscale(0.5);
        }
        .btn-run i { font-size: 22px; }
        .btn-run .badge {
            font-size: 12px;
            background: rgba(0,0,0,0.15);
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 500;
        }
        .status-msg {
            font-size: 14px;
            color: #8892b0;
            padding: 12px 24px;
            border-radius: 60px;
            background: rgba(255,215,0,0.04);
            border: 1px solid rgba(255,215,0,0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 200px;
        }
        .status-msg i { color: #ffd700; }
        .status-msg .highlight { color: #ffd700; font-weight: 600; }

        /* ========== TOKEN INPUT ========== */
        .token-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            background: rgba(255,215,0,0.03);
            padding: 8px 16px 8px 24px;
            border-radius: 60px;
            border: 1px solid rgba(255,215,0,0.06);
        }
        .token-area label {
            color: #8892b0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .token-area label i { color: #ffd700; }
        .token-area input {
            background: transparent;
            border: 1px solid rgba(255,215,0,0.12);
            border-radius: 40px;
            padding: 8px 18px;
            color: #ccd6f6;
            font-size: 13px;
            min-width: 220px;
            outline: none;
            transition: 0.2s;
        }
        .token-area input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.05);
        }
        .token-area .save-token {
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.12);
            color: #ffd700;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .token-area .save-token:hover {
            background: rgba(255,215,0,0.15);
        }

        /* ========== REPORTS TABLE ========== */
        .reports-section {
            background: rgba(16, 24, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 28px 32px;
            border: 1px solid rgba(255,215,0,0.06);
        }
        .reports-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .reports-header h3 {
            color: #ccd6f6;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .reports-header h3 i { color: #ffd700; }
        .reports-header .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,215,0,0.04);
            padding: 4px 16px 4px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.06);
        }
        .reports-header .search-box i { color: #8892b0; }
        .reports-header .search-box input {
            background: transparent;
            border: none;
            padding: 8px 0;
            color: #ccd6f6;
            outline: none;
            font-size: 13px;
            min-width: 150px;
        }
        .reports-header .search-box input::placeholder { color: #495670; }

        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 14px 16px;
            color: #8892b0;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,215,0,0.05);
        }
        td {
            padding: 14px 16px;
            color: #ccd6f6;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,215,0,0.03);
        }
        tr:hover td { background: rgba(255,215,0,0.02); }
        .report-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .report-name i { color: #ffd700; }
        .report-name .badge-status {
            font-size: 10px;
            padding: 2px 12px;
            border-radius: 40px;
            font-weight: 600;
        }
        .badge-success { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .badge-failed { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .badge-running { background: rgba(251, 146, 60, 0.15); color: #f97316; }
        .badge-idle { background: rgba(250, 204, 21, 0.15); color: #facc15; }
        .download-btn {
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.12);
            padding: 6px 18px;
            border-radius: 40px;
            color: #ffd700;
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .download-btn:hover {
            background: rgba(255,215,0,0.15);
            border-color: #ffd700;
        }
        .no-reports {
            color: #495670;
            padding: 30px;
            text-align: center;
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 13px;
            color: #495670;
            border-top: 1px solid rgba(255,215,0,0.05);
            padding-top: 25px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer a {
            color: #ffd700;
            text-decoration: none;
            opacity: 0.6;
            transition: 0.2s;
        }
        .footer a:hover { opacity: 1; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .charts-row { grid-template-columns: 1fr; }
            .action-area { flex-direction: column; align-items: stretch; }
            .action-left { justify-content: center; }
            .status-msg { justify-content: center; }
            .token-area { justify-content: center; }
            .header { flex-direction: column; align-items: flex-start; }
            .brand h1 { font-size: 22px; }
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .reports-header { flex-direction: column; align-items: stretch; }
            .reports-header .search-box { width: 100%; }
            .reports-header .search-box input { width: 100%; }
        }
        @media (max-width: 450px) {
            .stats-grid { grid-template-columns: 1fr; }
            .btn-run { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<!-- ===== جزيئات ذهبية ===== -->
<div id="particles"></div>

<div class="dashboard">

    <!-- ===== HEADER ===== -->
    <div class="header animate__animated animate__fadeInDown">
        <div class="brand">
            <div class="logo-icon"><i class="fas fa-skull"></i></div>
            <div>
                <h1>haidar7900</h1>
                <span class="sub"><i class="fas fa-shield-alt"></i> Ultimate Bug Bounty v4.0</span>
            </div>
        </div>
        <div class="status-badge">
            <div class="dot idle" id="statusDot"></div>
            <span class="label" id="statusLabel">جاهز</span>
            <span class="time" id="statusTime">—</span>
        </div>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card animate__animated animate__fadeInUp" style="animation-delay:0.05s;">
            <div class="number" id="statTargets">0</div>
            <div class="desc"><i class="fas fa-bullseye"></i> الأهداف</div>
        </div>
        <div class="stat-card animate__animated animate__fadeInUp" style="animation-delay:0.1s;">
            <div class="number" id="statRuns">0</div>
            <div class="desc"><i class="fas fa-play"></i> عمليات التشغيل</div>
        </div>
        <div class="stat-card animate__animated animate__fadeInUp" style="animation-delay:0.15s;">
            <div class="number" id="statVulns">0</div>
            <div class="desc"><i class="fas fa-bug"></i> ثغرات مكتشفة</div>
        </div>
        <div class="stat-card animate__animated animate__fadeInUp" style="animation-delay:0.2s;">
            <div class="number" id="statLastRun">—</div>
            <div class="desc"><i class="fas fa-clock"></i> آخر تشغيل</div>
        </div>
    </div>

    <!-- ===== CHARTS ===== -->
    <div class="charts-row">
        <div class="chart-box animate__animated animate__fadeInLeft">
            <h3><i class="fas fa-chart-line"></i> توزيع الثغرات</h3>
            <canvas id="vulnChart"></canvas>
        </div>
        <div class="chart-box animate__animated animate__fadeInRight">
            <h3><i class="fas fa-chart-pie"></i> نسبة نجاح التشغيل</h3>
            <canvas id="successChart"></canvas>
        </div>
    </div>

    <!-- ===== ACTION AREA ===== -->
    <div class="action-area animate__animated animate__fadeInUp">
        <div class="action-left">
            <button class="btn-run" id="runBtn" onclick="triggerWorkflow()">
                <i class="fas fa-rocket"></i>
                <span>تشغيل الفحص الكامل</span>
                <span class="badge">All Tools</span>
            </button>
            <div class="status-msg" id="statusMsg">
                <i class="fas fa-circle-info"></i>
                اضغط الزر لبدء الفحص على جميع الأهداف
            </div>
        </div>
        <div class="token-area">
            <label><i class="fas fa-key"></i> GitHub Token</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxx...">
            <button class="save-token" onclick="saveToken()"><i class="fas fa-check"></i> حفظ</button>
        </div>
    </div>

    <!-- ===== REPORTS TABLE ===== -->
    <div class="reports-section animate__animated animate__fadeInUp">
        <div class="reports-header">
            <h3><i class="fas fa-file-alt"></i> آخر التقارير</h3>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchReports" placeholder="بحث..." oninput="filterReports()">
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>التقرير</th>
                        <th>الحجم</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr><td colspan="5" class="no-reports"><i class="fas fa-spinner fa-pulse"></i> جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <span>© 2026 <a href="https://github.com/haidar7900" target="_blank">haidar7900</a> · Bug Bounty Automation</span>
        <span>
            <i class="fas fa-shield-alt"></i>
            <a href="https://github.com/haidar7900/bugbounty-automation" target="_blank">GitHub Repo</a>
            <span style="margin:0 8px;">|</span>
            <i class="fas fa-code"></i> v4.0
        </span>
    </div>
</div>

<script>
    // ============================================================
    //  CONFIG
    // ============================================================
    const REPO_OWNER = 'haidar7900';
    const REPO_NAME  = 'bugbounty-automation';
    const WORKFLOW_ID = 'auto-hunt.yml';

    // ============================================================
    //  STATE
    // ============================================================
    let currentRunId = null;
    let pollInterval = null;
    let token = localStorage.getItem('gh_token') || '';
    let allReports = [];

    // ============================================================
    //  DOM REFS
    // ============================================================
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    const statusTime = document.getElementById('statusTime');
    const statusMsg = document.getElementById('statusMsg');
    const runBtn = document.getElementById('runBtn');
    const tokenInput = document.getElementById('githubToken');
    const reportBody = document.getElementById('reportTableBody');

    // ============================================================
    //  PARTICLES
    // ============================================================
    (function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (10 + Math.random() * 20) + 's';
            p.style.animationDelay = (Math.random() * 20) + 's';
            p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
            container.appendChild(p);
        }
    })();

    // ============================================================
    //  TOKEN
    // ============================================================
    if (token) tokenInput.value = token;

    function saveToken() {
        const t = tokenInput.value.trim();
        if (t) {
            localStorage.setItem('gh_token', t);
            token = t;
            statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> تم حفظ التوكن بنجاح';
            setTimeout(() => {
                statusMsg.innerHTML = '<i class="fas fa-circle-info"></i> جاهز لتشغيل الفحص';
            }, 2500);
        } else {
            localStorage.removeItem('gh_token');
            token = '';
            statusMsg.innerHTML = '<i class="fas fa-triangle-exclamation" style="color:#facc15;"></i> تم حذف التوكن';
        }
    }

    // ============================================================
    //  SET STATUS
    // ============================================================
    function setStatus(type, text) {
        dot.className = 'dot ' + type;
        label.textContent = text;
    }

    // ============================================================
    //  TRIGGER WORKFLOW
    // ============================================================
    async function triggerWorkflow() {
        if (!token) {
            statusMsg.innerHTML = '<i class="fas fa-times-circle" style="color:#ef4444;"></i> الرجاء إدخال GitHub Token أولاً';
            return;
        }

        runBtn.disabled = true;
        setStatus('running', 'جارٍ التشغيل...');
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري إرسال الطلب...';

        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_ID}/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({ ref: 'main' })
            });

            if (res.status === 204) {
                statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ✅ تم تشغيل الفحص بنجاح! انتظر النتائج...';
                setTimeout(() => { pollLatestRun(); }, 5000);
            } else {
                const err = await res.text();
                throw new Error(`HTTP ${res.status}: ${err}`);
            }
        } catch (e) {
            statusMsg.innerHTML = `<i class="fas fa-times-circle" style="color:#ef4444;"></i> خطأ: ${e.message}`;
            setStatus('idle', 'فشل');
        } finally {
            runBtn.disabled = false;
        }
    }

    // ============================================================
    //  POLL LATEST RUN
    // ============================================================
    async function pollLatestRun() {
        if (!token) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?per_page=1`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const data = await res.json();
            if (data.workflow_runs && data.workflow_runs.length > 0) {
                const run = data.workflow_runs[0];
                currentRunId = run.id;
                if (run.status === 'completed') {
                    updateRunStatus(run);
                } else {
                    setStatus('running', 'جاري التنفيذ...');
                    statusTime.textContent = new Date(run.created_at).toLocaleTimeString();
                    if (pollInterval) clearInterval(pollInterval);
                    pollInterval = setInterval(() => { pollRunStatus(); }, 7000);
                }
            }
        } catch (e) { console.warn('pollLatestRun error', e); }
    }

    async function pollRunStatus() {
        if (!currentRunId || !token) return;
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs/${currentRunId}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const run = await res.json();
            if (run.status === 'completed') {
                clearInterval(pollInterval);
                pollInterval = null;
                updateRunStatus(run);
                loadReports();
                loadStats();
                updateCharts();
            } else {
                setStatus('running', 'جاري التنفيذ...');
                statusTime.textContent = new Date(run.updated_at).toLocaleTimeString();
            }
        } catch (e) { console.warn('pollRunStatus error', e); }
    }

    function updateRunStatus(run) {
        const conclusion = run.conclusion || 'success';
        if (conclusion === 'success') {
            setStatus('success', '✅ نجاح');
            statusMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> الفحص اكتمل بنجاح! حمل التقرير من الجدول.';
        } else if (conclusion === 'failure') {
            setStatus('failed', '❌ فشل');
            statusMsg.innerHTML = '<i class="fas fa-times-circle" style="color:#ef4444;"></i> الفحص فشل، راجع السجلات.';
        } else {
            setStatus('idle', 'جاهز');
        }
        statusTime.textContent = new Date(run.updated_at).toLocaleTimeString();
        document.getElementById('statLastRun').textContent = new Date(run.updated_at).toLocaleString();
        loadReports();
        updateCharts();
    }

    // ============================================================
    //  LOAD STATS
    // ============================================================
    async function loadStats() {
        try {
            // عدد الأهداف من targets.txt
            const tRes = await fetch('https://raw.githubusercontent.com/haIdar7900/bugbounty-automation/main/config/targets.txt');
            const tText = await tRes.text();
            const lines = tText.split('\n').filter(l => l.trim());
            document.getElementById('statTargets').textContent = lines.length || 0;

            if (token) {
                const runsRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/runs?per_page=1`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const runsData = await runsRes.json();
                if (runsData.total_count !== undefined) {
                    document.getElementById('statRuns').textContent = runsData.total_count;
                }
                if (runsData.workflow_runs && runsData.workflow_runs.length > 0) {
                    const last = runsData.workflow_runs[0];
                    document.getElementById('statLastRun').textContent = new Date(last.updated_at).toLocaleString();
                }
            }
        } catch (e) { console.warn('loadStats error', e); }
    }

    // ============================================================
    //  LOAD REPORTS
    // ============================================================
    async function loadReports() {
        if (!token) {
            reportBody.innerHTML = `<tr><td colspan="5" class="no-reports"><i class="fas fa-lock"></i> أدخل التوكن لعرض التقارير</td></tr>`;
            return;
        }
        try {
            const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/artifacts?per_page=50`, {
                headers: { 'Authorization': `token ${token}` }
            });
            const data = await res.json();
            if (!data.artifacts || data.artifacts.length === 0) {
                reportBody.innerHTML = `<tr><td colspan="5" class="no-reports"><i class="fas fa-inbox"></i> لا توجد تقارير بعد</td></tr>`;
                return;
            }
            allReports = data.artifacts;
            renderReports(allReports);
        } catch (e) {
            reportBody.innerHTML = `<tr><td colspan="5" class="no-reports" style="color:#ef4444;"><i class="fas fa-exclamation-circle"></i> خطأ في تحميل التقارير</td></tr>`;
            console.warn('loadReports error', e);
        }
    }

    function renderReports(reports) {
        if (!reports || reports.length === 0) {
            reportBody.innerHTML = `<tr><td colspan="5" class="no-reports"><i class="fas fa-inbox"></i> لا توجد تقارير</td></tr>`;
            return;
        }
        let html = '';
        reports.forEach(a => {
            const date = new Date(a.created_at).toLocaleString();
            const size = (a.size_in_bytes / 1024).toFixed(1);
            const status = a.expired ? 'منتهي' : 'متاح';
            const badgeClass = a.expired ? 'badge-failed' : 'badge-success';
            html += `
                <tr>
                    <td>
                        <div class="report-name">
                            <i class="fas fa-file-archive"></i>
                            ${a.name}
                        </div>
                    </td>
                    <td>${size} KB</td>
                    <td>${date}</td>
                    <td><span class="badge-status ${badgeClass}">${status}</span></td>
                    <td>
                        <a href="${a.archive_download_url}" class="download-btn" target="_blank">
                            <i class="fas fa-download"></i> تحميل
                        </a>
                    </td>
                </tr>
            `;
        });
        reportBody.innerHTML = html;
    }

    function filterReports() {
        const query = document.getElementById('searchReports').value.toLowerCase();
        if (!query) { renderReports(allReports); return; }
        const filtered = allReports.filter(a => a.name.toLowerCase().includes(query));
        renderReports(filtered);
    }

    // ============================================================
    //  CHARTS
    // ============================================================
    let vulnChart = null;
    let successChart = null;

    function initCharts() {
        const ctx1 = document.getElementById('vulnChart').getContext('2d');
        const ctx2 = document.getElementById('successChart').getContext('2d');

        vulnChart = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['حرجة', 'عالية', 'متوسطة', 'منخفضة'],
                datasets: [{
                    data: [0, 0, 0, 0],
                    backgroundColor: ['#ef4444', '#f97316', '#facc15', '#4ade80'],
                    borderColor: ['#0a0e17', '#0a0e17', '#0a0e17', '#0a0e17'],
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#8892b0', font: { size: 12 } }
                    }
                }
            }
        });

        successChart = new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['ناجح', 'فاشل', 'قيد التشغيل'],
                datasets: [{
                    data: [0, 0, 0],
                    backgroundColor: ['#4ade80', '#ef4444', '#facc15'],
                    borderColor: ['#0a0e17', '#0a0e17', '#0a0e17'],
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#8892b0', font: { size: 12 } }
                    }
                }
            }
        });
    }

    async function updateCharts() {
        if (!vulnChart || !successChart) return;
        try {
            // محاكاة بيانات من آخر تقرير (يمكن تطويرها لقراءة الملفات الفعلية)
            vulnChart.data.datasets[0].data = [2, 5, 8, 3];
            vulnChart.update();

            successChart.data.datasets[0].data = [12, 3, 2];
            successChart.update();
        } catch (e) { console.warn('updateCharts error', e); }
    }

    // ============================================================
    //  AUTO REFRESH
    // ============================================================
    setInterval(() => {
        loadStats();
        if (currentRunId) pollRunStatus();
    }, 30000);

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        initCharts();
        loadStats();
        loadReports();
        setTimeout(updateCharts, 1000);
    });
</script>
</body>
</html>
